<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wellora Profit Desk</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Premium dashboard look: deep ink background with soft colour glows, layered cards with a light top edge,
   Plus Jakarta Sans for headings and Inter for numbers and text. Sidebar on desktop, scrolling tab bar on phones. */
:root{
  --bg:#f1f3fa; --glow1:rgba(99,102,241,.10); --glow2:rgba(16,185,129,.07);
  --surface:#ffffff; --surface-2:#f6f7fc; --fg:#0f1530; --muted:#69728f; --line:#e5e8f2; --line-strong:#d3d9ea; --field:#f4f5fb;
  --accent:#4357e2; --accent-2:#6a5cf0; --accent-soft:#eaedff; --accent-fg:#ffffff;
  --good:#0b8a5d; --good-bg:#e4f6ee; --bad:#d03a30; --bad-bg:#fdecea; --warn:#a35f00; --warn-bg:#fff2d9;
  --bar:#bcc4df;
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 1px 2px rgba(15,21,48,.05),0 14px 34px -16px rgba(15,21,48,.14);
  --display:'Plus Jakarta Sans','Inter',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#070a15; --glow1:rgba(99,102,241,.20); --glow2:rgba(16,185,129,.08);
  --surface:#10152e; --surface-2:#0c1026; --fg:#eceffb; --muted:#97a0c3; --line:#1e2644; --line-strong:#2b355d; --field:#0a0e22;
  --accent:#8c9cff; --accent-2:#a592ff; --accent-soft:#1a2147; --accent-fg:#070a15;
  --good:#4ad8a3; --good-bg:#0d2c26; --bad:#ff8a7e; --bad-bg:#331619; --warn:#f4b061; --warn-bg:#32260f;
  --bar:#46517f;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 16px 40px -18px rgba(0,0,0,.7);
  color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
::selection{background:var(--accent);color:var(--accent-fg)}
body{margin:0;color:var(--fg);font:14px/1.55 var(--body);letter-spacing:-.006em;-webkit-font-smoothing:antialiased;
  background-color:var(--bg);
  background-image:radial-gradient(900px 520px at 6% -8%,var(--glow1),transparent 62%),radial-gradient(760px 480px at 100% 0%,var(--glow2),transparent 58%);
  background-attachment:fixed}
a{color:var(--accent)}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-right:1px solid var(--line);padding:22px 14px 18px;display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 20px}
.brand img{width:36px;height:36px;border-radius:11px;flex:none;box-shadow:0 6px 18px -6px color-mix(in srgb,var(--accent) 70%,transparent),0 0 0 1px color-mix(in srgb,var(--accent) 25%,transparent)}
.brand b{display:block;font:800 16px/1.1 var(--display);letter-spacing:-.025em}
.brand span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
nav .grp{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.85;padding:20px 12px 7px}
nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px;transition:background .15s,color .15s}
nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav a:hover{background:color-mix(in srgb,var(--fg) 5%,transparent);color:var(--fg)}
nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 20%,transparent)}
.side-foot{margin-top:auto;padding:18px 6px 0}
.chips{display:grid;gap:8px;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);font-size:12.5px;font-weight:500}
.chip small{margin-left:auto;color:var(--muted);font-size:11.5px;font-weight:500}
.foot-note{font-size:11.5px;color:var(--muted);padding:0 4px}
.main{padding:34px 40px 80px;max-width:1360px;width:100%;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap;margin-bottom:28px}
.page-head h1{font:800 30px/1.1 var(--display);letter-spacing:-.035em;margin:0}
.page-head p{margin:7px 0 0;color:var(--muted);font-size:14.5px}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sync-note{font-size:12.5px;color:var(--muted)}
#view.in{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#view.in{animation:none}*{transition:none!important}}

/* controls */
button,select,input{font:inherit;color:var(--fg)}
button,select{background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:0 14px;height:37px;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s,transform .05s}
button:hover,select:hover{border-color:var(--accent)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.6;cursor:default}
button.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));color:var(--accent-fg);border-color:color-mix(in srgb,var(--accent) 80%,#000);font-weight:600;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 6px 16px -8px var(--accent)}
button.primary:hover{filter:brightness(1.07)}
button.link{border:0;background:none;color:var(--bad);height:auto;padding:2px 6px;box-shadow:none}
input{background:var(--field);border:1px solid var(--line-strong);border-radius:10px;padding:0 12px;height:37px;min-width:0;transition:border-color .15s,box-shadow .15s}
input[type=file]{height:auto;padding:6px 8px;color:var(--muted)}
input[type=file]::file-selector-button{background:var(--surface);color:var(--fg);border:1px solid var(--line-strong);border-radius:8px;padding:6px 12px;margin-right:10px;font:inherit;font-weight:500;cursor:pointer}
input[type=file]::file-selector-button:hover{border-color:var(--accent)}
input[type=checkbox]{height:auto}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
td select{height:30px;padding:0 8px;font-size:13px;border-radius:8px}

/* date filter bar */
.toolbar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin-bottom:26px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap;box-shadow:var(--shadow)}
.seg button{border:0;border-radius:9px;background:transparent;height:31px;padding:0 13px;color:var(--muted);font-weight:500}
.seg button:hover{color:var(--fg);border-color:transparent}
.seg button.on{background:var(--accent);color:var(--accent-fg);font-weight:600;box-shadow:0 4px 12px -6px var(--accent)}
.range-pick{display:inline-flex;gap:12px;flex-wrap:wrap;align-items:center}
.range-pick label{display:flex;flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.range-pick input{height:35px}
.showing{margin-left:auto;color:var(--muted);font-size:13px}

/* cards and tiles */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;min-width:0;box-shadow:var(--shadow)}
.card h2{font:700 15.5px/1.3 var(--display);letter-spacing:-.02em;color:var(--fg);margin:0 0 16px}
.card{overflow-x:auto}
.card > table th,.card > table td{padding:10px 12px}
.card + .card,.card + .toolbar,.toolbar + .card{margin-top:22px}
.sect{display:flex;align-items:center;gap:12px;font:700 11.5px var(--display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:34px 0 14px}
.sect::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.sect:first-child{margin-top:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:0}
.kpis.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.kpi .k{font-size:13px;color:var(--muted);font-weight:500}
.kpi .v{font:700 28px/1.1 var(--body);margin-top:10px;font-variant-numeric:tabular-nums;letter-spacing:-.04em;overflow-wrap:anywhere}
.kpi .v .cur{font-weight:500;font-size:.68em;opacity:.55;margin-right:2px;vertical-align:.18em;letter-spacing:0}
.kpi .n{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.55}
.kpi.big .v{font-size:42px}
.kpi.mid .v{font-size:34px}
.kpi.good{background:linear-gradient(140deg,var(--good-bg),var(--surface) 78%);border-color:color-mix(in srgb,var(--good) 30%,var(--line))}.kpi.good .v{color:var(--good)}
.kpi.bad{background:linear-gradient(140deg,var(--bad-bg),var(--surface) 78%);border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}.kpi.bad .v{color:var(--bad)}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.mini span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.mini b{font:700 18px/1.2 var(--body);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.mini em{font-style:normal;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.spark{display:block;width:calc(100% + 44px);height:42px;margin:14px -22px -20px}
.card .kpis{gap:14px}
.card .kpi{box-shadow:none;background:var(--surface-2)}
.card .kpi.good{background:var(--good-bg)}.card .kpi.bad{background:var(--bad-bg)}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px}
.three{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}

/* tables */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:13px}
table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
th{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
td.r,th.r{text-align:right}
.card > table{border:1px solid var(--line);border-radius:13px;overflow:hidden}
.pos{color:var(--good)}.neg{color:var(--bad)}.mut{color:var(--muted)}

/* labels, forms, notices */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--field);border:1px solid var(--line);line-height:1.55}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.delivered{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.rto{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.risk-high{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.risk-medium{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.risk-low{color:var(--muted)}
.pill.shipped,.pill.new{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.cancelled{color:var(--muted)}
.pill.st-awaiting{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.st-ofd{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);border-color:transparent}
.pill.st-undel{background:var(--warn-bg);color:var(--bad);border-color:transparent}
.pill.st-transit{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.st-delivered{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.st-rto{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.st-cancelled{color:var(--muted)}
.pipe{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--field);gap:2px}
.pipe i{display:block;min-width:3px}
.pipekey{display:flex;gap:8px 22px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--muted)}
.pipekey b{color:var(--fg);font-weight:600;margin-left:4px}
.pipekey i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
a.trk{color:var(--accent);text-decoration:none;font-weight:500}
a.trk:hover{text-decoration:underline}
.form{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.form label,.fields label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:500;color:var(--muted)}
.form input,.form select{min-width:120px}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:13px;padding:13px 18px;margin-bottom:22px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.conn{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bar);flex:none}.dot.ok{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent)}.dot.err{background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 22%,transparent)}
.legend{display:flex;gap:18px;font-size:12.5px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
iframe{display:block;width:100%;height:calc(100vh - 160px);min-height:800px;border:1px solid var(--line);border-radius:16px;background:transparent}
code{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12.5px}

@media (max-width:1100px){.kpis,.kpis.k3{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.three{grid-template-columns:minmax(0,1fr)}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;gap:6px;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
  .brand{padding:0 8px 0 2px}.brand span{display:none}
  nav{display:flex;gap:2px}nav .grp{display:none}nav a{padding:8px 11px;white-space:nowrap}
  .side-foot{display:none}
  .main{padding:22px 16px 60px}
  .page-head h1{font-size:26px}
  .showing{margin-left:0;width:100%}
}
@media (max-width:640px){.kpis,.kpis.k2,.kpis.k3{grid-template-columns:minmax(0,1fr)}.fields{grid-template-columns:minmax(0,1fr)}.kpi.big .v{font-size:36px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="/favicon.svg" alt=""><div><b>Profit Desk</b><span>Wellora</span></div></div>
    <nav id="tabs" aria-label="Main">
      <a href="#overview"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9zm0 7h6v-4H4v4zm10 0h6v-9h-6v9zm0-16v4h6V4h-6z"/></svg>Overview</a>
      <div class="grp">Sales</div>
      <a href="#orders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 016 0"/></svg>Orders</a>
      <a href="#tracking"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></svg>Live tracking</a>
      <a href="#products"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12L4 7.5M12 12v9"/></svg>Products</a>
      <a href="#risk"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>Risk check</a>
      <div class="grp">Marketing</div>
      <a href="#meta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Meta Ads</a>
      <div class="grp">Money</div>
      <a href="#bank"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-6 9 6"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg>Bank</a>
      <a href="#supplier"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>Supplier</a>
      <div class="grp">Tools</div>
      <a href="#calculator"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/></svg>Calculator</a>
      <a href="#settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</a>
    </nav>
    <div class="side-foot">
      <div class="chips">
        <div class="chip"><i class="dot" id="dot-shopify"></i>Shopify<small id="st-shopify"></small></div>
        <div class="chip"><i class="dot" id="dot-meta"></i>Meta Ads<small id="st-meta"></small></div>
      </div>
      <div class="foot-note">Your data stays on this Mac.</div>
    </div>
  </aside>
  <main class="main">
    <header class="page-head">
      <div><h1 id="ptitle">Overview</h1><p id="psub"></p></div>
      <div class="ctrl">
        <span class="sync-note" id="syncnote"></span>
        <select id="prod" aria-label="Product" title="Show one product or all products"></select>
        <select id="range" aria-label="Date range">
          <option value="1">Today</option><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option>
          <option value="90">Last 90 days</option><option value="0">All time</option>
        </select>
        <button class="primary" id="syncbtn">Sync now</button>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const inr = (n, d = 0) => (n < 0 ? '-' : '') + '₹' + Math.abs(n).toLocaleString('en-IN', { maximumFractionDigits: d, minimumFractionDigits: d });
const cls = n => (n > 0.5 ? 'pos' : n < -0.5 ? 'neg' : 'mut');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let curProduct = ''; try { curProduct = localStorage.getItem('pd_product') || ''; } catch { /* no storage */ }
const SCOPED = /^\/(summary|orders|tracking|risk|meta|ads)(\?|$)/;   // these tabs follow the product chosen in the header
const withProduct = path => curProduct && SCOPED.test(path) ? path + (path.includes('?') ? '&' : '?') + 'product=' + encodeURIComponent(curProduct) : path;
const api = async (path, opts = {}) => {
  if (!opts.method || opts.method === 'GET') path = withProduct(path);
  const r = await fetch('/api' + path, { headers: { 'Content-Type': 'application/json' }, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
  return r.json();
};
const days = () => $('#range').value;
// Stored values stay the same; only the names shown on screen change.
// Every tab opens on the last 30 days. Each tab keeps its own choice while you switch tabs, and resets to 30 days when the page is reloaded.
let metaSel = { p: '30' };   // Meta Ads tab filter
let ovSel = { p: '30' };     // Overview tab filter
let ordSel = { p: '30' };    // Orders tab date filter
let bankSel = { p: '30' };   // Bank tab date filter
let riskSel = { p: '30' };   // Risk tab date filter
let riskFilter = { level: 'medium', confirm: '', q: '' };   // Risk tab: shows Medium and High risk by default

/* ---------- chart ---------- */
function chart(daily) {
  const W = 760, H = 330, L = 54, R = 12, T = 12, B = 28;
  const net = daily.map(d => d.gross - d.ads - d.adGst);
  const vals = [...daily.map(d => d.gross), ...daily.map(d => d.ads), ...net, 0];
  let max = Math.max(...vals), min = Math.min(...vals);
  if (max === min) max = min + 1;
  const pad = (max - min) * .08; max += pad; if (min < 0) min -= pad;
  const x = i => L + (i + .5) * (W - L - R) / daily.length;
  const y = v => T + (max - v) / (max - min) * (H - T - B);
  const bw = Math.max(2, Math.min(14, (W - L - R) / daily.length * .32));
  const k = v => { const a = Math.abs(v); const t = a >= 1000 ? Math.round(a / 100) / 10 + 'k' : String(Math.round(a)); return (v < 0 ? '-' : '') + '₹' + t.replace('.0k', 'k'); };
  const id = 'c' + Math.random().toString(36).slice(2, 7);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daily gross profit, ad spend and net profit"><defs>
    <linearGradient id="${id}a" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent)" stop-opacity=".55"/></linearGradient>
    <linearGradient id="${id}n" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--good)" stop-opacity=".22"/><stop offset="1" stop-color="var(--good)" stop-opacity="0"/></linearGradient></defs>`;
  for (let i = 0; i <= 4; i++) {
    const v = min + (max - min) * i / 4;
    s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="${L - 10}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${k(v)}</text>`;
  }
  s += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line-strong)"/>`;
  daily.forEach((d, i) => {
    const gh = Math.abs(y(d.gross) - y(0)), ah = Math.abs(y(0) - y(d.ads));
    if (gh > .5) s += `<rect x="${x(i) - bw - 1.5}" y="${Math.min(y(d.gross), y(0))}" width="${bw}" height="${gh}" fill="url(#${id}a)" rx="${Math.min(4, bw / 2)}"><title>${d.day} gross profit ${inr(d.gross)}</title></rect>`;
    if (ah > .5) s += `<rect x="${x(i) + 1.5}" y="${y(d.ads)}" width="${bw}" height="${ah}" fill="var(--bar)" rx="${Math.min(4, bw / 2)}"><title>${d.day} ad spend ${inr(d.ads)}</title></rect>`;
  });
  const pts = net.map((v, i) => `${x(i)},${y(v)}`);
  if (pts.length > 1) {
    s += `<polygon fill="url(#${id}n)" points="${x(0)},${y(0)} ${pts.join(' ')} ${x(net.length - 1)},${y(0)}"/>`;
    s += `<polyline fill="none" stroke="var(--good)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${pts.join(' ')}"/>`;
  }
  if (net.length) s += `<circle cx="${x(net.length - 1)}" cy="${y(net[net.length - 1])}" r="4.5" fill="var(--surface)" stroke="var(--good)" stroke-width="2.2"><title>Latest: ${inr(net[net.length - 1])}</title></circle>`;
  const step = Math.ceil(daily.length / 8);
  daily.forEach((d, i) => { if (i % step === 0) s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${d.day.slice(5)}</text>`; });
  return s + '</svg>';
}

/* Small trend line under a tile */
function spark(vals, color = 'var(--accent)') {
  const n = vals.length; if (n < 2) return '';
  const max = Math.max(...vals, 0), min = Math.min(...vals, 0), W = 120, H = 42;
  const x = i => i / (n - 1) * W, y = v => H - 4 - (max === min ? 0 : (v - min) / (max - min)) * (H - 12);
  const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const id = 's' + Math.random().toString(36).slice(2, 8);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".3"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polygon fill="url(#${id})" points="0,${H} ${pts} ${W},${H}"/><polyline fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="${pts}"/></svg>`;
}

/* ---------- Meta CSV parsing ---------- */
function splitCsv(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split('\n')[0];
  const sep = [',', ';', '\t'].map(c => [c, first.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); if (row.some(x => x.trim())) rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  row.push(cur); if (row.some(x => x.trim())) rows.push(row);
  return rows;
}
function normDay(s) {
  s = (s || '').trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  if (/^\d{4}\/\d{2}\/\d{2}$/.test(s)) return s.replace(/\//g, '-');
  const m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);       // dd/mm/yyyy (Indian accounts)
  if (m && +m[1] > 12) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  if (m && +m[2] > 12) return `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; // ambiguous: assume dd/mm
  const t = Date.parse(s + ' 12:00'); // "Nov 8, 2026"
  return isNaN(t) ? '' : new Date(t).toLocaleDateString('en-CA');
}
function parseAdsCsv(text) {
  const all = splitCsv(text);
  const hi = all.findIndex(r => r.some(h => /amount spent|^spend|^cost$/i.test(h.trim())));
  if (hi < 0) return { error: 'Could not find an "Amount spent" column. Export with Amount spent included.' };
  const head = all[hi].map(h => h.trim());
  const iSpend = head.findIndex(h => /amount spent|^spend|^cost$/i.test(h));
  let iDay = head.findIndex(h => /^(day|date)$/i.test(h));
  if (iDay < 0) iDay = head.findIndex(h => /reporting starts/i.test(h));
  const iCamp = head.findIndex(h => /campaign name|^campaign$/i.test(h));
  if (iDay < 0) return { error: 'No "Day" column found. In the export, set the breakdown to Day (one row per day).' };
  const cur = (head[iSpend].match(/\(([A-Z]{3})\)/) || [])[1];
  // Optional performance columns. Link clicks are preferred over "Clicks (all)" because CTR is normally quoted on link clicks.
  const find = (...res) => { for (const re of res) { const i = head.findIndex(h => re.test(h)); if (i >= 0) return i; } return -1; };
  const iImp = find(/^impressions$/i), iClk = find(/^link clicks$/i, /^clicks \(all\)$/i, /^clicks$/i), iReach = find(/^reach$/i);
  const iPur = find(/^(website )?purchases$/i, /^purchases \(/i, /^results$/i);
  const iVal = find(/purchases? conversion value/i, /^purchase value/i, /conversion value/i);
  const numAt = (r, i) => { if (i < 0) return null; const v = parseFloat((r[i] || '').replace(/[^0-9.\-]/g, '')); return isNaN(v) ? null : v; };
  const rows = []; let skipped = 0;
  for (const r of all.slice(hi + 1)) {
    if (/^total|^results from/i.test((r[iDay] || r[0] || '').trim())) continue;
    const day = normDay(r[iDay]);
    const spend = parseFloat((r[iSpend] || '').replace(/[^0-9.\-]/g, ''));
    if (!day || isNaN(spend)) { skipped++; continue; }
    rows.push({ day, campaign: iCamp >= 0 ? (r[iCamp] || '').trim() || 'All campaigns' : 'All campaigns', spend,
      impressions: numAt(r, iImp), clicks: numAt(r, iClk), reach: numAt(r, iReach), purchases: numAt(r, iPur), purchase_value: numAt(r, iVal) });
  }
  if (!rows.length) return { error: 'No usable rows found in this file.' };
  if (cur && cur !== 'INR') return { error: `This file is in ${cur}. The dashboard works in rupees, so export from the INR account.` };
  const extras = ['impressions', 'clicks', 'purchases', 'purchase_value'].filter(k => rows.some(r => r[k] !== null));
  return { rows, skipped, currency: cur, extras };
}

// Shared by the Ad spend and Meta Ads tabs
async function importCsvFile(file, msg, done) {
  const out = parseAdsCsv(await file.text());
  if (out.error) { msg.className = 'neg'; msg.textContent = out.error; return; }
  const r = await api('/ads/import', { method: 'POST', body: { rows: out.rows } });
  msg.className = 'pos';
  msg.textContent = `Imported ${r.imported} rows.` + (out.extras.length ? ` Also read: ${out.extras.join(', ').replace('purchase_value', 'purchase value')}.` : ' Spend only. Add Impressions, Link clicks, Purchases and Purchases conversion value to the export for CTR, CPC and ROAS.') + (out.skipped ? ` Skipped ${out.skipped} rows without a date.` : '');
  setTimeout(done, 1200);
}

/* ---------- Meta connect block ---------- */
function metaBlock(st, last) {
  const m = st.meta;
  const err = new URLSearchParams(location.hash.split('?')[1] || '').get('meta_error');
  const days = m.expiresAt ? Math.ceil((m.expiresAt - Date.now()) / 864e5) : null;
  let state, dot = '';
  if (!m.configured) {
    state = 'Not set up. Add META_APP_ID and META_APP_SECRET to .env, restart, then connect.';
  } else if (!m.hasAccount) {
    state = 'Add META_AD_ACCOUNT_ID to .env and restart.';
  } else if (m.expired) {
    state = 'Login expired. Connect again.'; dot = 'err';
  } else if (!m.connected) {
    state = 'Not connected yet.';
  } else if (last && !last.ok) {
    state = 'Error: ' + esc(last.message); dot = 'err';
  } else {
    state = (last ? 'Last synced ' + new Date(last.at).toLocaleString('en-IN') : 'Connected, waiting for first sync') + (days !== null ? ` · login valid for ${days} more days` : '');
    dot = days !== null && days <= 7 ? 'err' : 'ok';
  }
  const canConnect = m.configured && m.hasAccount;
  return `<div class="conn"><span class="dot ${dot}"></span><b>Meta Ads</b><span class="mut">${state}</span>
    ${canConnect ? `<a href="/auth/meta/start"><button type="button" class="${m.connected && !m.expired ? '' : 'primary'}">${m.connected ? 'Reconnect Meta' : 'Connect Meta'}</button></a>` : ''}</div>
    ${err ? `<div class="banner">Meta said: ${esc(err)}</div>` : ''}
    ${m.configured ? `<p class="mut" style="margin:0 0 8px;font-size:12px">In your Meta app, set the Valid OAuth Redirect URI to <code>${esc(m.redirectUri)}</code></p>` : ''}`;
}

      <div class="card"><h2>Supplier cost per product</h2>${prods.length ? `<div class="scroll"><table><thead><tr><th>Product</th><th class="r">Orders</th><th class="r">Cost per unit (₹)</th></tr></thead><tbody>${prods.map(p =>
        `<tr><td>${esc(p.title)}</td><td class="r">${p.orders}</td><td class="r"><input data-p="${esc(p.title)}" type="number" step="any" style="width:100px" placeholder="${s.default_cost}" value="${p.cost ?? ''}"></td></tr>`).join('')}</tbody></table></div>
        <p class="mut" style="font-size:12px;margin:10px 0 0">Leave blank to use the default cost.</p>` : '<div class="empty">Products appear here after your first orders sync.</div>'}</div>`;
    $('#save').onclick = async () => {
      const body = {}; el.querySelectorAll('input[data-k]').forEach(i => (body[i.dataset.k] = i.value));
      await api('/settings', { method: 'PUT', body }); $('#saved').textContent = 'Saved';
    };
    el.querySelectorAll('input[data-p]').forEach(i => i.onchange = () => api('/products', { method: 'PUT', body: { title: i.dataset.p, cost: i.value === '' ? null : i.value } }));
    $('#demo').onclick = async () => { await api('/demo', { method: 'POST' }); render(); };
    $('#nodemo').onclick = async () => { await api('/demo', { method: 'DELETE' }); render(); };
  },

  calculator(el) { el.innerHTML = '<iframe src="calculator.html" title="Profit calculator"></iframe>'; }
};

async function render() {
  let tab = (location.hash.slice(1).split('?')[0] || 'overview');
  if (tab === 'ads') tab = 'meta';   // manual ad spend now lives at the bottom of Meta Ads
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + tab));
  const PAGES = { overview: ['Overview', 'Profit, sales, ads and cash at a glance'], orders: ['Orders', 'Every Shopify order with its status and profit'],
    products: ['Products', 'Orders, returns, ad spend and profit for each product'],
    tracking: ['Live tracking', 'Where every order is: placed, shipped by Dropship India, delivered or RTO'],
    risk: ['Risk check', 'Spot suspicious orders before you ship them'], ads: ['Ad spend', 'Daily spend and manual ad entries'],
    meta: ['Meta Ads', 'Performance from Ads Manager: reach, clicks, cost and returns'], supplier: ['Supplier', 'Wallet, outstanding balance and payouts from Dropship India'],
    bank: ['Bank', 'Money in and out, Meta ad funds and supplier wallet'],
    settings: ['Settings', 'Connections, cost assumptions and product costs'], calculator: ['Profit calculator', 'Work out profit from orders placed, delivered and returned'] };
  const pg = PAGES[tab] || PAGES.overview;
  $('#ptitle').textContent = pg[0]; $('#psub').textContent = pg[1];
  status = await api('/status');
  const l = status.syncs.map(s => s.at).sort().pop();
  $('#syncnote').textContent = l ? 'Last sync ' + new Date(l).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '';
  $('#range').style.display = ['ads'].includes(tab) ? '' : 'none';
  { // product selector: list from the Products tab; only the tabs that can be split by product show it
    if (!window.__prodNames) { const g = await fetch('/api/products-tracker/config').catch(() => null); window.__prodNames = ((g && g.ok ? await g.json().catch(() => ({})) : {}).products || []).map(p => p.name); }
    const names = window.__prodNames;
    const sel = $('#prod'); if (curProduct && !names.includes(curProduct)) curProduct = '';
    sel.innerHTML = '<option value="">All products</option>' + names.map(n => `<option value="${esc(n)}"${n === curProduct ? ' selected' : ''}>${esc(n)}</option>`).join('');
    sel.onchange = () => { curProduct = sel.value; try { localStorage.setItem('pd_product', curProduct); } catch { /* ignore */ } render(); };
    const splits = ['overview', 'orders', 'tracking', 'risk', 'ads', 'meta'].includes(tab);
    sel.style.display = splits && names.length ? '' : 'none';
    if (curProduct && splits) $('#psub').textContent = 'Showing only ' + curProduct;
    else if (curProduct && ['bank', 'supplier'].includes(tab)) $('#psub').textContent += ' (shared by all products)';
  }
  const stat = (id, ok, text) => { $('#dot-' + id).className = 'dot ' + (ok ? 'ok' : ''); $('#st-' + id).textContent = text; };
  stat('shopify', status.connections.shopify, status.connections.shopify ? 'Connected' : 'Not connected');
  stat('meta', status.connections.meta, status.connections.meta ? 'Connected' : 'CSV import');
  const view = $('#view');
  if (tab !== window.lastTab) { view.classList.remove('in'); void view.offsetWidth; view.classList.add('in'); window.lastTab = tab; }
  await (views[tab] || views.overview)(view);
  // lighter, smaller rupee sign in big numbers
  view.querySelectorAll('.kpi .v').forEach(v => { if (!v.querySelector('.cur')) v.innerHTML = v.innerHTML.replace(/₹/g, '<span class="cur">₹</span>'); });
}
$('#range').onchange = render;
$('#syncbtn').onclick = async e => { e.target.disabled = true; e.target.textContent = 'Syncing…'; await api('/sync', { method: 'POST' }); e.target.disabled = false; e.target.textContent = 'Sync now'; render(); };
window.addEventListener('hashchange', render);
render();
setInterval(() => { if (!document.hidden && ['', '#overview'].includes(location.hash)) render(); }, 5 * 60 * 1000);
setInterval(() => { if (!document.hidden && location.hash === '#tracking' && document.activeElement?.tagName !== 'INPUT') render(); }, 60 * 1000);
</script>
</body>
</html>
