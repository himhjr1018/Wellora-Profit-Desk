<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wellora Profit Desk</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{
  --bg:#f5f6f8; --surface:#fff; --fg:#14182b; --muted:#5d6479; --line:#dfe2ea; --field:#f5f6f8;
  --accent:#2d3a8c; --accent-fg:#fff; --good:#12805c; --good-bg:#e2f4ec; --bad:#c2352b; --bad-bg:#fbe9e7; --warn:#b4690e; --warn-bg:#fdf0dc;
  --bar:#aab1c8; --display:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1220; --surface:#171b2e; --fg:#e8eaf4; --muted:#9aa2bd; --line:#2a3050; --field:#0f1220;
  --accent:#8e9cff; --accent-fg:#0f1220; --good:#4cd3a0; --good-bg:#12332b; --bad:#ff8277; --bad-bg:#3a1b1a; --warn:#f0a95a; --warn-bg:#3a2c14;
  --bar:#4a5379; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 56px}
.top{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
h1{font:700 24px var(--display);margin:0;letter-spacing:-.01em}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync-note{font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
nav a{padding:9px 14px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
nav a.on{color:var(--fg);border-color:var(--accent)}
button,select,input{font:inherit;color:var(--fg)}
button,select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.link{border:0;background:none;color:var(--bad);padding:2px 6px}
input{background:var(--field);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{font:700 12px var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font:700 22px var(--display);margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hero{grid-column:span 2}
.kpi.hero .v{font-size:32px}
.kpi.good{background:var(--good-bg);border-color:transparent}.kpi.good .v{color:var(--good)}
.kpi.bad{background:var(--bad-bg);border-color:transparent}.kpi.bad .v{color:var(--bad)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.three{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:600 11px var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
.pos{color:var(--good)}.neg{color:var(--bad)}.mut{color:var(--muted)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500;background:var(--field);border:1px solid var(--line)}
.pill.delivered{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.rto{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.shipped,.pill.new{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form input,.form select{min-width:110px}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.conn{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bar)}.dot.ok{background:var(--good)}.dot.err{background:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;background:var(--surface);padding:7px 12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
iframe{width:100%;height:1100px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.three{grid-template-columns:minmax(0,1fr)}.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.kpis{grid-template-columns:minmax(0,1fr)}.kpi.hero{grid-column:auto}.fields{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Wellora Profit Desk</h1>
    <div class="ctrl">
      <span class="sync-note" id="syncnote"></span>
      <select id="range" aria-label="Date range">
        <option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option><option value="0">All time</option>
      </select>
      <button class="primary" id="syncbtn">Sync now</button>
    </div>
  </div>
  <nav id="tabs">
    <a href="#overview">Overview</a><a href="#orders">Orders</a><a href="#ads">Ad spend</a><a href="#meta">Meta Ads</a>
    <a href="#bank">Bank</a><a href="#settings">Settings</a><a href="#calculator">Calculator</a>
  </nav>
  <div id="view"></div>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const inr = (n, d = 0) => (n < 0 ? '-' : '') + '₹' + Math.abs(n).toLocaleString('en-IN', { maximumFractionDigits: d, minimumFractionDigits: d });
const cls = n => (n > 0.5 ? 'pos' : n < -0.5 ? 'neg' : 'mut');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const api = async (path, opts = {}) => {
  const r = await fetch('/api' + path, { headers: { 'Content-Type': 'application/json' }, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
  return r.json();
};
const days = () => $('#range').value;
// Stored values stay the same; only the names shown on screen change.
let metaSel = { p: '30', date: '' };   // Meta Ads tab filter, kept while you switch tabs
const STATUSES =['new', 'shipped', 'delivered', 'rto', 'cancelled'];
const STATUS_LABEL = { new: 'Placed', shipped: 'Shipped', delivered: 'Delivered', rto: 'RTO', cancelled: 'Cancelled' };
const today = () => new Date().toLocaleDateString('en-CA');
let status = null;

/* ---------- chart ---------- */
function chart(daily) {
  const W = 760, H = 230, L = 52, R = 10, T = 10, B = 26;
  const net = daily.map(d => d.gross - d.ads - d.adGst);
  const vals = [...daily.map(d => d.gross), ...daily.map(d => d.ads), ...net, 0];
  let max = Math.max(...vals), min = Math.min(...vals);
  if (max === min) max = min + 1;
  const pad = (max - min) * .08; max += pad; if (min < 0) min -= pad;
  const x = i => L + (i + .5) * (W - L - R) / daily.length;
  const y = v => T + (max - v) / (max - min) * (H - T - B);
  const bw = Math.max(2, (W - L - R) / daily.length * .34);
  const ticks = 4;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daily gross profit, ad spend and net profit">`;
  for (let i = 0; i <= ticks; i++) {
    const v = min + (max - min) * i / ticks;
    s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${inr(v / 1000 >= 1 || v / 1000 <= -1 ? Math.round(v / 1000) * 1000 : Math.round(v)).replace(/,000$/, 'k')}</text>`;
  }
  s += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  daily.forEach((d, i) => {
    s += `<rect x="${x(i) - bw - 1}" y="${Math.min(y(d.gross), y(0))}" width="${bw}" height="${Math.abs(y(d.gross) - y(0))}" fill="var(--accent)" rx="1"><title>${d.day} gross profit ${inr(d.gross)}</title></rect>`;
    s += `<rect x="${x(i) + 1}" y="${y(d.ads)}" width="${bw}" height="${Math.abs(y(0) - y(d.ads))}" fill="var(--bar)" rx="1"><title>${d.day} ad spend ${inr(d.ads)}</title></rect>`;
  });
  s += `<polyline fill="none" stroke="var(--good)" stroke-width="2" points="${net.map((v, i) => `${x(i)},${y(v)}`).join(' ')}"/>`;
  const step = Math.ceil(daily.length / 8);
  daily.forEach((d, i) => { if (i % step === 0) s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.day.slice(5)}</text>`; });
  return s + '</svg>';
}

/* ---------- Meta CSV parsing ---------- */
function splitCsv(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split('\n')[0];
  const sep = [',', ';', '\t'].map(c => [c, first.split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); if (row.some(x => x.trim())) rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  row.push(cur); if (row.some(x => x.trim())) rows.push(row);
  return rows;
}
function normDay(s) {
  s = (s || '').trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  if (/^\d{4}\/\d{2}\/\d{2}$/.test(s)) return s.replace(/\//g, '-');
  const m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);       // dd/mm/yyyy (Indian accounts)
  if (m && +m[1] > 12) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  if (m && +m[2] > 12) return `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; // ambiguous: assume dd/mm
  const t = Date.parse(s + ' 12:00'); // "Nov 8, 2026"
  return isNaN(t) ? '' : new Date(t).toLocaleDateString('en-CA');
}
function parseAdsCsv(text) {
  const all = splitCsv(text);
  const hi = all.findIndex(r => r.some(h => /amount spent|^spend|^cost$/i.test(h.trim())));
  if (hi < 0) return { error: 'Could not find an "Amount spent" column. Export with Amount spent included.' };
  const head = all[hi].map(h => h.trim());
  const iSpend = head.findIndex(h => /amount spent|^spend|^cost$/i.test(h));
  let iDay = head.findIndex(h => /^(day|date)$/i.test(h));
  if (iDay < 0) iDay = head.findIndex(h => /reporting starts/i.test(h));
  const iCamp = head.findIndex(h => /campaign name|^campaign$/i.test(h));
  if (iDay < 0) return { error: 'No "Day" column found. In the export, set the breakdown to Day (one row per day).' };
  const cur = (head[iSpend].match(/\(([A-Z]{3})\)/) || [])[1];
  // Optional performance columns. Link clicks are preferred over "Clicks (all)" because CTR is normally quoted on link clicks.
  const find = (...res) => { for (const re of res) { const i = head.findIndex(h => re.test(h)); if (i >= 0) return i; } return -1; };
  const iImp = find(/^impressions$/i), iClk = find(/^link clicks$/i, /^clicks \(all\)$/i, /^clicks$/i), iReach = find(/^reach$/i);
  const iPur = find(/^(website )?purchases$/i, /^purchases \(/i, /^results$/i);
  const iVal = find(/purchases? conversion value/i, /^purchase value/i, /conversion value/i);
  const numAt = (r, i) => { if (i < 0) return null; const v = parseFloat((r[i] || '').replace(/[^0-9.\-]/g, '')); return isNaN(v) ? null : v; };
  const rows = []; let skipped = 0;
  for (const r of all.slice(hi + 1)) {
    if (/^total|^results from/i.test((r[iDay] || r[0] || '').trim())) continue;
    const day = normDay(r[iDay]);
    const spend = parseFloat((r[iSpend] || '').replace(/[^0-9.\-]/g, ''));
    if (!day || isNaN(spend)) { skipped++; continue; }
    rows.push({ day, campaign: iCamp >= 0 ? (r[iCamp] || '').trim() || 'All campaigns' : 'All campaigns', spend,
      impressions: numAt(r, iImp), clicks: numAt(r, iClk), reach: numAt(r, iReach), purchases: numAt(r, iPur), purchase_value: numAt(r, iVal) });
  }
  if (!rows.length) return { error: 'No usable rows found in this file.' };
  if (cur && cur !== 'INR') return { error: `This file is in ${cur}. The dashboard works in rupees, so export from the INR account.` };
  const extras = ['impressions', 'clicks', 'purchases', 'purchase_value'].filter(k => rows.some(r => r[k] !== null));
  return { rows, skipped, currency: cur, extras };
}

// Shared by the Ad spend and Meta Ads tabs
async function importCsvFile(file, msg, done) {
  const out = parseAdsCsv(await file.text());
  if (out.error) { msg.className = 'neg'; msg.textContent = out.error; return; }
  const r = await api('/ads/import', { method: 'POST', body: { rows: out.rows } });
  msg.className = 'pos';
  msg.textContent = `Imported ${r.imported} rows.` + (out.extras.length ? ` Also read: ${out.extras.join(', ').replace('purchase_value', 'purchase value')}.` : ' Spend only. Add Impressions, Link clicks, Purchases and Purchases conversion value to the export for CTR, CPC and ROAS.') + (out.skipped ? ` Skipped ${out.skipped} rows without a date.` : '');
  setTimeout(done, 1200);
}

/* ---------- Meta connect block ---------- */
function metaBlock(st, last) {
  const m = st.meta;
  const err = new URLSearchParams(location.hash.split('?')[1] || '').get('meta_error');
  const days = m.expiresAt ? Math.ceil((m.expiresAt - Date.now()) / 864e5) : null;
  let state, dot = '';
  if (!m.configured) {
    state = 'Not set up. Add META_APP_ID and META_APP_SECRET to .env, restart, then connect.';
  } else if (!m.hasAccount) {
    state = 'Add META_AD_ACCOUNT_ID to .env and restart.';
  } else if (m.expired) {
    state = 'Login expired. Connect again.'; dot = 'err';
  } else if (!m.connected) {
    state = 'Not connected yet.';
  } else if (last && !last.ok) {
    state = 'Error: ' + esc(last.message); dot = 'err';
  } else {
    state = (last ? 'Last synced ' + new Date(last.at).toLocaleString('en-IN') : 'Connected, waiting for first sync') + (days !== null ? ` · login valid for ${days} more days` : '');
    dot = days !== null && days <= 7 ? 'err' : 'ok';
  }
  const canConnect = m.configured && m.hasAccount;
  return `<div class="conn"><span class="dot ${dot}"></span><b>Meta Ads</b><span class="mut">${state}</span>
    ${canConnect ? `<a href="/auth/meta/start"><button type="button" class="${m.connected && !m.expired ? '' : 'primary'}">${m.connected ? 'Reconnect Meta' : 'Connect Meta'}</button></a>` : ''}</div>
    ${err ? `<div class="banner">Meta said: ${esc(err)}</div>` : ''}
    ${m.configured ? `<p class="mut" style="margin:0 0 8px;font-size:12px">In your Meta app, set the Valid OAuth Redirect URI to <code>${esc(m.redirectUri)}</code></p>` : ''}`;
}

/* ---------- views ---------- */
const views = {
  async overview(el) {
    const d = await api('/summary?days=' + days());
    const k = d.kpi;
    const tile = (label, v, note = '', c = '') => `<div class="kpi ${c}"><div class="k">${label}</div><div class="v">${v}</div><div class="n">${note}</div></div>`;
    const empty = !k.orders && !status.syncs.length;
    el.innerHTML = `
      ${empty ? `<div class="banner"><span>No data yet. Connect Shopify and Meta in <a href="#settings">Settings</a>, or load sample data to look around.</span><button id="demo">Load sample data</button></div>` : ''}
      <div class="kpis">
        ${tile('Net profit', inr(k.net), `${d.from} to ${d.to}. After ads, ${inr(k.adGst)} ad GST and ${inr(k.fixed)} fixed costs`, 'hero ' + (k.net >= 0 ? 'good' : 'bad'))}
        ${tile('Ad spend', inr(k.adSpend),`+ ${inr(k.adGst)} GST · ROAS ${k.roas ? k.roas.toFixed(2) + 'x' : 'n/a'} · CPA ${inr(k.cpa)}`)}
        ${tile('Bank balance', inr(k.bankBalance), `In ${inr(k.bankIn)} · Out ${inr(k.bankOut)} this period`)}
        ${tile('Orders', k.placed.toLocaleString('en-IN'), `Sales ${inr(k.sales)} · ${inr(k.profitPerOrder)} profit per order`)}
        ${tile('RTO rate', k.rtoRate.toFixed(1) + '%', `${k.rto} returned of ${k.delivered + k.rto} settled`, k.rtoRate > 30 ? 'bad' : '')}
        ${tile('Gross profit', inr(k.gross), 'Delivered minus RTO losses, before ads')}
        ${tile('Still in transit', inr(k.expectedPending), `${d.counts.new + d.counts.shipped} orders, profit if all are delivered`)}
      </div>
      <div class="two">
        <div class="card"><h2>Daily profit and ad spend</h2>
          <div class="legend"><span><i style="background:var(--accent)"></i>Gross profit</span><span><i style="background:var(--bar)"></i>Ad spend</span><span><i style="background:var(--good)"></i>Net after ads</span></div>
          ${chart(d.daily)}</div>
        <div class="card"><h2>Order status</h2>${Object.entries(d.counts).map(([s, n]) =>
          `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span class="pill ${s}">${STATUS_LABEL[s] || s}</span><b>${n}</b></div>`).join('')}
          <div class="mut" style="margin-top:10px;font-size:12px">COD share ${k.codShare.toFixed(0)}% of orders</div></div>
      </div>
      <div class="three">
        <div class="card"><h2>Bank movement by category</h2>${d.bankByCategory.length ? `<table><tbody>${d.bankByCategory.map(b =>
          `<tr><td>${esc(b.category)}</td><td class="r ${b.type === 'in' ? 'pos' : 'neg'}">${b.type === 'in' ? '+' : '-'}${inr(b.amt)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No bank entries yet.</div>'}</div>
        <div class="card"><h2>Orders vs bank</h2><table><tbody>
          <tr><td>Delivered revenue (after GST)</td><td class="r">${inr(k.revenue)}</td></tr>
          <tr><td>Money received in bank</td><td class="r">${inr(k.bankIn)}</td></tr>
          <tr><td>Gap</td><td class="r ${cls(k.bankIn - k.revenue)}">${inr(k.bankIn - k.revenue)}</td></tr></tbody></table>
          <p class="mut" style="font-size:12px;margin:10px 0 0">A large negative gap usually means COD remittances from the courier are still pending.</p></div>
      </div>`;
    $('#demo')?.addEventListener('click', async () => { await api('/demo', { method: 'POST' }); render(); });
  },

  async orders(el) {
    el.innerHTML = `<div class="card"><div class="form">
      <label>Status<select id="f-status"><option value="">All</option>${STATUSES.map(s => `<option value="${s}">${STATUS_LABEL[s]}</option>`).join('')}</select></label>
      <label>Search<input id="f-q" placeholder="Order, customer, city, product"></label>
      <span class="mut" id="ocount"></span></div>
      <div class="scroll" id="otable"></div></div>`;
    const load = async () => {
      const rows = await api(`/orders?days=${days()}&status=${$('#f-status').value}&q=${encodeURIComponent($('#f-q').value)}`);
      $('#ocount').textContent = rows.length + ' orders';
      $('#otable').innerHTML = rows.length ? `<table><thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>City</th><th>Product</th><th>Pay</th><th class="r">Amount</th><th>Status</th><th class="r">Profit</th></tr></thead><tbody>${rows.slice(0, 500).map(o => `
        <tr><td>${esc(o.name)}</td><td>${o.day}</td><td>${o.customer ? esc(o.customer) : '<span class="mut">–</span>'}</td><td>${esc(o.city)}</td><td>${esc(o.product)}</td><td>${o.payment.toUpperCase()}</td><td class="r">${inr(o.total)}</td>
        <td><select data-id="${esc(o.id)}">${STATUSES.map(s => `<option value="${s}" ${s === o.status ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}</select></td>
        <td class="r ${cls(o.profit)}">${inr(o.profit)}${o.state === 'expected' ? ' <span class="mut" title="Profit if this order is delivered">if delivered</span>' : ''}</td></tr>`).join('')}</tbody></table>`
        : '<div class="empty">No orders in this range.</div>';
      el.querySelectorAll('select[data-id]').forEach(s => s.addEventListener('change', async () => {
        await api('/orders/' + encodeURIComponent(s.dataset.id), { method: 'PATCH', body: { status: s.value } }); load();
      }));
    };
    $('#f-status').onchange = load; $('#f-q').oninput = load; load();
  },

  async ads(el) {
    const rows = await api('/ads?days=' + days());
    const byDay = {};
    rows.forEach(r => (byDay[r.day] = (byDay[r.day] || 0) + r.spend));
    const total = rows.reduce((a, r) => a + r.spend, 0);
    el.innerHTML = `<div class="card"><h2>Add manual ad spend</h2><form class="form" id="adform">
      <label>Date<input type="date" id="a-day" value="${today()}"></label>
      <label>Campaign<input id="a-camp" placeholder="e.g. Google Search"></label>
      <label>Spend (₹)<input id="a-spend" type="number" min="0" step="any" required></label>
      <button class="primary">Add</button></form>
      <p class="mut" style="margin:0 0 12px">Use this for spend outside Meta, such as Google ads or one-off charges. To import Meta data from Ads Manager, use the <a href="#meta">Meta Ads</a> tab. Total for this range before GST: <b>${inr(total)}</b>. GST on ads is shown as its own column on the Meta Ads tab and counted separately in the Overview.</p>
      <div class="scroll">${rows.length ? `<table><thead><tr><th>Date</th><th>Campaign</th><th>Source</th><th class="r">Spend</th><th></th></tr></thead><tbody>${rows.map(r =>
        `<tr><td>${r.day}</td><td>${esc(r.campaign)}</td><td class="mut">${r.source}</td><td class="r">${inr(r.spend)}</td><td><button class="link" data-d="${r.day}" data-c="${esc(r.campaign)}">Delete</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">No ad spend yet.</div>'}</div></div>`;
    $('#adform').onsubmit = async e => { e.preventDefault(); await api('/ads', { method: 'POST', body: { day: $('#a-day').value, campaign: $('#a-camp').value, spend: $('#a-spend').value } }); render(); };
    el.querySelectorAll('button[data-d]').forEach(b => b.onclick = async () => { await api(`/ads?day=${b.dataset.d}&campaign=${encodeURIComponent(b.dataset.c)}`, { method: 'DELETE' }); render(); });
  },

  async meta(el) {
    const iso = off => { const x = new Date(); x.setDate(x.getDate() - off); return x.toLocaleDateString('en-CA'); };
    const PRESETS = [['today', 'Today'], ['yesterday', 'Yesterday'], ['7', '7 days'], ['30', '30 days'], ['90', '90 days'], ['all', 'All time']];
    const sel = metaSel;
    const query = { today: `from=${iso(0)}&to=${iso(0)}`, yesterday: `from=${iso(1)}&to=${iso(1)}`,
      7: `from=${iso(6)}&to=${iso(0)}`, 30: `from=${iso(29)}&to=${iso(0)}`, 90: `from=${iso(89)}&to=${iso(0)}`, all: 'days=0',
      day: `from=${sel.date}&to=${sel.date}` }[sel.p] || 'days=30';
    const d = await api('/meta?' + query);
    const t = d.total;
    const rangeLabel = sel.p === 'all' ? 'All time' : d.from === d.to ? d.from : `${d.from} to ${d.to}`;
    const f = (n, dp = 0) => (n === null || n === undefined || !isFinite(n)) ? '–' : n.toLocaleString('en-IN', { maximumFractionDigits: dp, minimumFractionDigits: dp });
    const rs = (n, dp = 0) => (n === null || n === undefined || !isFinite(n)) ? '–' : inr(n, dp);
    const ratio = (a, b, mul = 1) => (a !== null && a !== undefined && b > 0) ? a / b * mul : null;
    const calc = r => ({ ctr: ratio(r.clicks, r.impressions, 100), cpc: ratio(r.spend_c, r.clicks), cpm: ratio(r.spend_i, r.impressions, 1000),
      cpp: ratio(r.spend_p, r.purchases), roas: ratio(r.value, r.spend_v), freq: ratio(r.impressions, r.reach) });
    const T = calc(t);
    const has = t.impressions > 0;
    const tile = (k, v, n = '') => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="n">${n}</div></div>`;

    // Daily chart: spend bars and Meta-reported purchase value line
    const rows = d.daily, W = 760, H = 210, L = 52, R = 10, Tp = 10, B = 24;
    const max = Math.max(1, ...rows.map(r => Math.max(r.spend || 0, r.value || 0))) * 1.08;
    const x = i => L + (i + .5) * (W - L - R) / Math.max(1, rows.length), y = v => Tp + (max - v) / max * (H - Tp - B);
    const bw = Math.max(2, (W - L - R) / Math.max(1, rows.length) * .6);
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daily Meta spend and purchase value">`;
    for (let i = 0; i <= 4; i++) { const v = max * i / 4; svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${v >= 1000 ? Math.round(v / 1000) + 'k' : Math.round(v)}</text>`; }
    rows.forEach((r, i) => { svg += `<rect x="${x(i) - bw / 2}" y="${y(r.spend || 0)}" width="${bw}" height="${y(0) - y(r.spend || 0)}" fill="var(--bar)" rx="1"><title>${r.day} spend ${inr(r.spend || 0)}</title></rect>`; });
    const pts = rows.map((r, i) => r.value != null ? `${x(i)},${y(r.value)}` : null).filter(Boolean);
    if (pts.length > 1) svg += `<polyline fill="none" stroke="var(--good)" stroke-width="2" points="${pts.join(' ')}"/>`;
    const step = Math.ceil(rows.length / 8);
    rows.forEach((r, i) => { if (i % step === 0) svg += `<text x="${x(i)}" y="${H - 7}" text-anchor="middle" font-size="10" fill="var(--muted)">${r.day.slice(5)}</text>`; });
    svg += '</svg>';

    el.innerHTML = `
      <div class="card" style="margin-bottom:16px"><div class="form" style="margin:0;align-items:center">
        <div class="seg" role="group" aria-label="Date range">${PRESETS.map(([k, l]) => `<button type="button" data-p="${k}" class="${sel.p === k ? 'on' : ''}">${l}</button>`).join('')}</div>
        <label style="flex-direction:row;align-items:center;gap:8px">Pick a day<input type="date" id="mday" value="${sel.p === 'day' ? sel.date : ''}" max="${iso(0)}"></label>
        <span class="mut">Showing ${rangeLabel}</span></div></div>
      <div class="card" style="margin-bottom:16px"><h2>Update Meta data</h2>
        <p class="mut" style="margin:0 0 10px">Export from Ads Manager with the breakdown set to <b>Day</b> and these columns: <b>Campaign name, Amount spent, Impressions, Link clicks, Reach, Purchases, Purchases conversion value</b>. Re-importing a day updates it.</p>
        <div class="form" style="margin:0"><input type="file" id="mcsv" accept=".csv,text/csv,.txt"><span id="mmsg" class="mut"></span></div></div>
      ${!has ? `<div class="banner"><span>Only spend is stored so far. Import a CSV that includes impressions and clicks to see CTR, CPC, CPM and ROAS.</span></div>` : ''}
      <div class="kpis">
        ${tile('Spend', rs(t.spend), `+ ${rs(t.gst_amount)} GST (${d.gst}%) = ${rs(t.total_cost)} total · ${rangeLabel}`)}
        ${tile('Impressions', f(t.impressions), T.freq ? `Frequency ${f(T.freq, 2)}` : 'Not in import')}
        ${tile('CTR (link)', T.ctr === null ? '–' : f(T.ctr, 2) + '%', `${f(t.clicks)} link clicks`)}
        ${tile('CPC', rs(T.cpc, 2), 'Spend per link click')}
        ${tile('CPM', rs(T.cpm, 2), 'Spend per 1,000 impressions')}
        ${tile('Purchases', f(t.purchases), `Cost per purchase ${rs(T.cpp, 2)}`)}
        ${tile('Meta ROAS', T.roas === null ? '–' : f(T.roas, 2) + 'x', `Reported purchase value ${rs(t.value)}`)}
        ${tile('Blended ROAS', d.blended.roas ? f(d.blended.roas, 2) + 'x' : '–', `Shopify sales ${rs(d.blended.sales)} ÷ spend`)}
      </div>
      <div class="card" style="margin-bottom:16px"><h2>Daily spend and Meta-reported purchase value</h2>
        <div class="legend"><span><i style="background:var(--bar)"></i>Spend</span><span><i style="background:var(--good)"></i>Purchase value</span></div>${svg}
        <p class="mut" style="font-size:12px;margin:8px 0 0">Meta ROAS comes from Meta's own attribution. Blended ROAS uses your actual Shopify sales, so it includes orders Meta didn't claim and counts COD orders that never arrived. Compare the two.</p></div>
      <div class="card" style="margin-bottom:16px"><h2>Day by day</h2><div class="scroll">${d.daily.length ? `<table><thead><tr><th>Date</th><th class="r">Spend</th><th class="r">GST ${d.gst}%</th><th class="r">Total cost</th><th class="r">Impr.</th><th class="r">CTR</th><th class="r">CPC</th><th class="r">CPM</th><th class="r">Purchases</th><th class="r">Cost / purchase</th><th class="r">ROAS</th></tr></thead><tbody>${[...d.daily].reverse().map(r => { const m = calc(r); return `
        <tr><td>${r.day}</td><td class="r">${rs(r.spend)}</td><td class="r mut">${rs(r.gst_amount, 2)}</td><td class="r">${rs(r.total_cost)}</td><td class="r">${f(r.impressions)}</td><td class="r">${m.ctr === null ? '–' : f(m.ctr, 2) + '%'}</td><td class="r">${rs(m.cpc, 2)}</td><td class="r">${rs(m.cpm, 2)}</td><td class="r">${f(r.purchases)}</td><td class="r">${rs(m.cpp, 2)}</td><td class="r"><b>${m.roas === null ? '–' : f(m.roas, 2) + 'x'}</b></td></tr>`; }).join('')}</tbody></table>` : '<div class="empty">No Meta data for this period.</div>'}</div></div>
      <div class="card"><h2>By campaign</h2><div class="scroll">${d.campaigns.length ? `<table><thead><tr><th>Campaign</th><th class="r">Spend</th><th class="r">GST ${d.gst}%</th><th class="r">Total cost</th><th class="r">Impr.</th><th class="r">CTR</th><th class="r">CPC</th><th class="r">CPM</th><th class="r">Purchases</th><th class="r">Cost / purchase</th><th class="r">ROAS</th></tr></thead><tbody>${d.campaigns.map(c => { const m = calc(c); return `
        <tr><td>${esc(c.campaign)}</td><td class="r">${rs(c.spend)}</td><td class="r mut">${rs(c.gst_amount, 2)}</td><td class="r">${rs(c.total_cost)}</td><td class="r">${f(c.impressions)}</td><td class="r">${m.ctr === null ? '–' : f(m.ctr, 2) + '%'}</td><td class="r">${rs(m.cpc, 2)}</td><td class="r">${rs(m.cpm, 2)}</td><td class="r">${f(c.purchases)}</td><td class="r">${rs(m.cpp, 2)}</td><td class="r"><b>${m.roas === null ? '–' : f(m.roas, 2) + 'x'}</b></td></tr>`; }).join('')}
        <tr style="font-weight:600"><td>Total</td><td class="r">${rs(t.spend)}</td><td class="r">${rs(t.gst_amount, 2)}</td><td class="r">${rs(t.total_cost)}</td><td class="r">${f(t.impressions)}</td><td class="r">${T.ctr === null ? '–' : f(T.ctr, 2) + '%'}</td><td class="r">${rs(T.cpc, 2)}</td><td class="r">${rs(T.cpm, 2)}</td><td class="r">${f(t.purchases)}</td><td class="r">${rs(T.cpp, 2)}</td><td class="r">${T.roas === null ? '–' : f(T.roas, 2) + 'x'}</td></tr></tbody></table>` : '<div class="empty">No Meta data in this range.</div>'}</div></div>`;
    el.querySelectorAll('.seg button').forEach(b => b.onclick = () => { metaSel = { p: b.dataset.p, date: '' }; render(); });
    $('#mday').onchange = e => { if (e.target.value) { metaSel = { p: 'day', date: e.target.value }; render(); } };
    $('#mcsv').onchange = e => { const file = e.target.files[0]; if (file) importCsvFile(file, $('#mmsg'), render); };
  },

  async bank(el) {
    const rows = await api('/bank?days=' + days());
    const cats = ['COD remittance', 'Gateway payout', 'Owner capital', 'Refund received', 'Ads', 'Supplier', 'Courier', 'Tools', 'Salary', 'Withdrawal', 'Other'];
    const inn = rows.filter(r => r.type === 'in').reduce((a, r) => a + r.amount, 0), out = rows.filter(r => r.type === 'out').reduce((a, r) => a + r.amount, 0);
    el.innerHTML = `<div class="card"><h2>Add bank entry</h2><form class="form" id="bform">
      <label>Date<input type="date" id="b-day" value="${today()}"></label>
      <label>Type<select id="b-type"><option value="in">Money in</option><option value="out">Money out</option></select></label>
      <label>Amount (₹)<input id="b-amt" type="number" min="1" step="any" required></label>
      <label>Category<select id="b-cat">${cats.map(c => `<option>${c}</option>`).join('')}</select></label>
      <label>Note<input id="b-note" placeholder="Optional"></label>
      <button class="primary">Add</button></form>
      <p class="mut" style="margin:0 0 12px">This range: in <b class="pos">${inr(inn)}</b>, out <b class="neg">${inr(out)}</b>, net <b>${inr(inn - out)}</b></p>
      <div class="scroll">${rows.length ? `<table><thead><tr><th>Date</th><th>Category</th><th>Note</th><th class="r">Amount</th><th></th></tr></thead><tbody>${rows.map(r =>
        `<tr><td>${r.day}</td><td>${esc(r.category)}</td><td class="mut">${esc(r.note)}</td><td class="r ${r.type === 'in' ? 'pos' : 'neg'}">${r.type === 'in' ? '+' : '-'}${inr(r.amount)}</td><td><button class="link" data-id="${r.id}">Delete</button></td></tr>`).join('')}</tbody></table>` : '<div class="empty">No bank entries yet.</div>'}</div></div>`;
    $('#bform').onsubmit = async e => {
      e.preventDefault();
      await api('/bank', { method: 'POST', body: { day: $('#b-day').value, type: $('#b-type').value, amount: $('#b-amt').value, category: $('#b-cat').value, note: $('#b-note').value } });
      render();
    };
    el.querySelectorAll('button[data-id]').forEach(b => b.onclick = async () => { await api('/bank/' + b.dataset.id, { method: 'DELETE' }); render(); });
  },

  async settings(el) {
    const [s, prods, st] = await Promise.all([api('/settings'), api('/products'), api('/status')]);
    const F = (k, label, step = 'any') => `<label>${label}<input data-k="${k}" type="number" step="${step}" value="${s[k]}"></label>`;
    const sync = src => st.syncs.find(x => x.source === src);
    const conn = (src, name, hint) => { const c = st.connections[src], l = sync(src);
      return `<div class="conn"><span class="dot ${!c ? '' : l && !l.ok ? 'err' : 'ok'}"></span><b>${name}</b><span class="mut">${!c ? 'Not connected. ' + hint : l ? (l.ok ? 'Last synced ' + new Date(l.at).toLocaleString('en-IN') : 'Error: ' + esc(l.message)) : 'Connected, waiting for first sync'}</span></div>`; };
    el.innerHTML = `
      <div class="card" style="margin-bottom:16px"><h2>Connections</h2>
        ${conn('shopify', 'Shopify', 'Add SHOPIFY_STORE and SHOPIFY_TOKEN to .env')}
        ${metaBlock(st, sync('meta'))}
        <p class="mut" style="margin:8px 0 0;font-size:12px">Copy <code>.env.example</code> to <code>.env</code>, fill it in, then restart the app. Data syncs every ${st.syncMinutes} minutes. Tag a Shopify order <code>rto</code> or <code>delivered</code> to set its status automatically, or change it on the Orders tab.</p>
        <div class="form" style="margin:12px 0 0"><button id="demo">Load sample data</button><button id="nodemo">Remove sample data</button></div></div>
      <div class="card" style="margin-bottom:16px"><h2>Cost assumptions</h2><div class="fields">
        ${F('default_cost', 'Default supplier cost (₹)')}${F('gst', 'GST rate (%)')}${F('price_incl_gst', 'Price includes GST (1 = yes, 0 = no)', '1')}
        ${F('ship', 'Forward courier (₹)')}${F('return_ship', 'Return courier (₹)')}${F('pack', 'Packaging (₹)')}
        ${F('cod_fee', 'COD fee (₹)')}${F('gateway_pct', 'Gateway fee, prepaid (%)')}${F('platform_pct', 'Platform fee (%)')}
        ${F('ad_gst', 'GST on ad spend (%)')}${F('fixed_monthly', 'Fixed monthly costs (₹)')}${F('opening_balance', 'Bank opening balance (₹)')}
      </div><div class="form" style="margin:14px 0 0"><button class="primary" id="save">Save</button><span class="mut" id="saved"></span></div></div>
      <div class="card"><h2>Supplier cost per product</h2>${prods.length ? `<div class="scroll"><table><thead><tr><th>Product</th><th class="r">Orders</th><th class="r">Cost per unit (₹)</th></tr></thead><tbody>${prods.map(p =>
        `<tr><td>${esc(p.title)}</td><td class="r">${p.orders}</td><td class="r"><input data-p="${esc(p.title)}" type="number" step="any" style="width:100px" placeholder="${s.default_cost}" value="${p.cost ?? ''}"></td></tr>`).join('')}</tbody></table></div>
        <p class="mut" style="font-size:12px;margin:10px 0 0">Leave blank to use the default cost.</p>` : '<div class="empty">Products appear here after your first orders sync.</div>'}</div>`;
    $('#save').onclick = async () => {
      const body = {}; el.querySelectorAll('input[data-k]').forEach(i => (body[i.dataset.k] = i.value));
      await api('/settings', { method: 'PUT', body }); $('#saved').textContent = 'Saved';
    };
    el.querySelectorAll('input[data-p]').forEach(i => i.onchange = () => api('/products', { method: 'PUT', body: { title: i.dataset.p, cost: i.value === '' ? null : i.value } }));
    $('#demo').onclick = async () => { await api('/demo', { method: 'POST' }); render(); };
    $('#nodemo').onclick = async () => { await api('/demo', { method: 'DELETE' }); render(); };
  },

  calculator(el) { el.innerHTML = '<iframe src="calculator.html" title="Profit calculator"></iframe>'; }
};

async function render() {
  const tab = (location.hash.slice(1).split('?')[0] || 'overview');
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + tab));
  status = await api('/status');
  const l = status.syncs.map(s => s.at).sort().pop();
  $('#syncnote').textContent = l ? 'Last sync ' + new Date(l).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '';
  $('#range').style.display = ['overview', 'orders', 'ads', 'bank'].includes(tab) ? '' : 'none';
  await (views[tab] || views.overview)($('#view'));
}
$('#range').onchange = render;
$('#syncbtn').onclick = async e => { e.target.disabled = true; e.target.textContent = 'Syncing…'; await api('/sync', { method: 'POST' }); e.target.disabled = false; e.target.textContent = 'Sync now'; render(); };
window.addEventListener('hashchange', render);
render();
setInterval(() => { if (!document.hidden && ['', '#overview'].includes(location.hash)) render(); }, 5 * 60 * 1000);
</script>
</body>
</html>
